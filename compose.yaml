services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: shanagri
      POSTGRES_USER: shanagri
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - farmdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U shanagri -d shanagri"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  farmdata:
