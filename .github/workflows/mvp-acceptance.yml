name: MVP acceptance
on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: acceptance
          POSTGRES_DB: acceptance
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 3s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgresql://postgres:acceptance@127.0.0.1:5432/acceptance
      DEMO_OWNER_TOKEN: local-acceptance-only
      API_BASE_URL: http://127.0.0.1:4000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: cp .env.example .env && npm run db:setup
      - run: npm run build -w @shanagri/web
      - run: pip install playwright==1.55.0 && python -m playwright install --with-deps chromium
      - name: Run API and browser acceptance
        run: |
          node apps/api/src/server.ts > /tmp/shanagri-api.log 2>&1 &
          (cd apps/web && ../../node_modules/.bin/next start -H 127.0.0.1) > /tmp/shanagri-web.log 2>&1 &
          curl --retry 20 --retry-connrefused --retry-delay 1 -fsS http://127.0.0.1:4000/health/ready
          curl --retry 20 --retry-connrefused --retry-delay 1 -fsS http://127.0.0.1:3000/ -o /dev/null
          node tests/acceptance/api.mjs
          python tests/acceptance/browser.py
